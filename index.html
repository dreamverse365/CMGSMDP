<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CMG Store Manager Development Program</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── TOKENS ─────────────────────────────── */
    :root {
      --bg:          #0a0a0f;
      --surface:     #13131a;
      --surface-2:   #1c1c28;
      --border:      rgba(255,255,255,0.08);
      --border-focus:rgba(255,255,255,0.35);
      --gold:        #c9a84c;
      --gold-light:  #e8c97a;
      --gold-dim:    rgba(201,168,76,0.15);
      --text:        #f0f0f0;
      --text-2:      #8a8a9a;
      --text-3:      #555568;
      --error:       #e05c5c;
      --success:     #4caf82;
      --radius:      12px;
      --radius-lg:   20px;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── BACKGROUND ─────────────────────────── */
    .bg-layer {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 10%, rgba(201,168,76,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 20% 90%, rgba(201,168,76,0.04) 0%, transparent 60%),
        var(--bg);
    }

    /* Thin diagonal rule — fashion editorial feel */
    .bg-layer::after {
      content: '';
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(
        -55deg,
        transparent,
        transparent 80px,
        rgba(255,255,255,0.012) 80px,
        rgba(255,255,255,0.012) 81px
      );
    }

    /* ── LAYOUT ─────────────────────────────── */
    .page {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    /* ── BRAND MARK ─────────────────────────── */
    .brand {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand__eyebrow {
      font-family: 'Manrope', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .brand__logo {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(28px, 7vw, 38px);
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text);
      line-height: 1;
    }

    .brand__logo span {
      color: var(--gold);
    }

    .brand__sub {
      font-family: 'Manrope', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: var(--text-2);
      margin-top: 8px;
    }

    .brand__divider {
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 16px auto 0;
    }

    /* ── CARD ───────────────────────────────── */
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.06),
        0 24px 64px rgba(0,0,0,0.6),
        0 2px 0 rgba(255,255,255,0.04) inset;
    }

    .card__title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }

    /* ── FORM ───────────────────────────────── */
    .field {
      margin-bottom: 16px;
    }

    .field__label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-3);
      margin-bottom: 8px;
    }

    .field__input-wrap {
      position: relative;
    }

    .field__icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: var(--text-3);
      pointer-events: none;
      transition: color 0.2s;
    }

    input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px 13px 42px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      letter-spacing: 0.05em;
    }

    input::placeholder { color: var(--text-3); letter-spacing: 0; }

    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
    }

    input:focus + .field__icon,
    .field__input-wrap:focus-within .field__icon { color: var(--gold); }

    .field__input-wrap:focus-within .field__icon { color: var(--gold); }

    /* Error state */
    input.input--error { border-color: var(--error); }

    /* ── BUTTON ─────────────────────────────── */
    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      border: none;
      border-radius: var(--radius);
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #0a0a0f;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover { opacity: 0.9; }
    .btn-login:active { transform: scale(0.98); }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login__spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(10,10,15,0.3);
      border-top-color: #0a0a0f;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    .btn-login.loading .btn-login__text { display: none; }
    .btn-login.loading .btn-login__spinner { display: block; }

    /* ── ERROR MSG ───────────────────────────── */
    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 12px 14px;
      background: rgba(224,92,92,0.1);
      border: 1px solid rgba(224,92,92,0.25);
      border-radius: var(--radius);
      font-size: 13px;
      color: #f08080;
    }

    .error-msg.visible { display: flex; }

    /* ── HINT ───────────────────────────────── */
    .hint {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: var(--text-3);
      line-height: 1.6;
    }

    /* ── TOAST ───────────────────────────────── */
    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 9999;
      max-width: 90vw;
      white-space: normal;
      text-align: center;
    }

    .toast--show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast--success { border-color: rgba(76,175,130,0.4); color: #6fcfa0; }
    .toast--error { border-color: rgba(224,92,92,0.4); color: #f08080; }

    /* ── FIRST LOGIN OVERLAY ─────────────────── */
    .overlay {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .overlay.visible { display: flex; }

    .overlay__card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7);
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    .overlay__icon {
      width: 56px; height: 56px;
      background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }

    .overlay__icon svg { width: 24px; height: 24px; color: var(--gold); }

    .overlay__title {
      font-family: 'Manrope', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .overlay__body {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .overlay__point {
      font-family: 'Manrope', sans-serif;
      font-size: 42px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
      margin: 16px 0 4px;
    }

    .overlay__point-label {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 28px;
      letter-spacing: 0.1em;
    }

    .btn-confirm {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      border: none;
      border-radius: var(--radius);
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #0a0a0f;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-confirm:hover { opacity: 0.9; }

    /* ── ANIMATIONS ─────────────────────────── */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── RESPONSIVE ─────────────────────────── */
    @media (max-width: 420px) {
      .card { padding: 28px 22px; }
      .brand__logo { font-size: 26px; }
    }
  </style>
</head>
<body>

<div class="bg-layer"></div>

<div class="page">

  <!-- Brand -->
  <div class="brand">
    <p class="brand__eyebrow">CENTRAL GROUP</p>
    <h1 class="brand__logo">CMG <span>STORE</span></h1>
    <p class="brand__sub">MANAGER DEVELOPMENT PROGRAM</p>
    <div class="brand__divider"></div>
  </div>

  <!-- Login Card -->
  <div class="card">
    <p class="card__title">เข้าสู่ระบบ</p>

    <div class="field">
      <label class="field__label" for="empId">EMPLOYEE ID</label>
      <div class="field__input-wrap">
        <input
          id="empId"
          type="text"
          inputmode="numeric"
          placeholder="2XXXXXXX"
          maxlength="8"
          autocomplete="username"
        >
        <!-- User icon -->
        <svg class="field__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="10" cy="6.5" r="3.5"/>
          <path d="M3 17c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="pin">รหัสผ่าน (เลขบัตรประชาชน 4 ตัวท้าย)</label>
      <div class="field__input-wrap">
        <input
          id="pin"
          type="password"
          inputmode="numeric"
          placeholder="••••"
          maxlength="4"
          autocomplete="current-password"
        >
        <!-- Lock icon -->
        <svg class="field__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="4" y="9" width="12" height="9" rx="2"/>
          <path d="M7 9V6.5a3 3 0 1 1 6 0V9" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      <span class="btn-login__text">เข้าสู่ระบบ</span>
      <div class="btn-login__spinner"></div>
    </button>

    <div class="error-msg" id="errorMsg">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
      </svg>
      <span id="errorText"></span>
    </div>
  </div>

  <p class="hint">CMG Store Manager Development Program &copy; 2026</p>

</div>

<!-- First Login Bonus Overlay -->
<div class="overlay" id="bonusOverlay">
  <div class="overlay__card">
    <div class="overlay__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 class="overlay__title">ยินดีต้อนรับ!</h2>
    <p class="overlay__body">คุณเข้าสู่ระบบครั้งแรก<br>รับโบนัสพิเศษทันที</p>
    <div class="overlay__point">+5</div>
    <p class="overlay__point-label">POINTS</p>
    <button class="btn-confirm" onclick="confirmBonus()">รับ Point เลย</button>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  // ── Auto-redirect if already logged in ──
  if (Session.get()) {
    window.location.href = 'pages/home.html';
  }

  // ── Input formatting ──
  document.getElementById('empId').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8);
    clearError();
  });

  document.getElementById('pin').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
    clearError();
  });

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });

  function setLoading(state) {
    const btn = document.getElementById('loginBtn');
    btn.disabled = state;
    btn.classList.toggle('loading', state);
  }

  function showError(msg) {
    const box = document.getElementById('errorMsg');
    document.getElementById('errorText').textContent = msg;
    box.classList.add('visible');
    document.getElementById('empId').classList.add('input--error');
    document.getElementById('pin').classList.add('input--error');
  }

  function clearError() {
    document.getElementById('errorMsg').classList.remove('visible');
    document.getElementById('empId').classList.remove('input--error');
    document.getElementById('pin').classList.remove('input--error');
  }

  async function handleLogin() {
    const empId = document.getElementById('empId').value.trim();
    const pin   = document.getElementById('pin').value.trim();

    if (!empId || !pin) {
      showError('กรุณากรอก Employee ID และรหัสผ่าน');
      return;
    }
    if (!/^2\d{7}$/.test(empId)) {
      showError('Employee ID ต้องขึ้นต้นด้วย 2 และมี 8 หลัก');
      return;
    }
    if (pin.length !== 4) {
      showError('รหัสผ่านต้องเป็นตัวเลข 4 หลัก');
      return;
    }

    setLoading(true);
    clearError();

    const result = await api('login', { empId, pin });

    setLoading(false);

    if (!result.success) {
      showError(result.message || 'เข้าสู่ระบบไม่สำเร็จ');
      return;
    }

    // Save session
    Session.save(result.user);

    // Check first login bonus
    if (!result.user.firstLogin) {
      document.getElementById('bonusOverlay').classList.add('visible');
    } else {
      window.location.href = 'pages/home.html';
    }
  }

  async function confirmBonus() {
    const session = Session.get();
    if (!session) return;

    const result = await api('firstLoginBonus', { empId: session.empId });

    if (result.success) {
      // Update session with new points
      session.availablePoint = result.newAvailable;
      session.totalPoint = result.newTotal;
      Session.save(session);
      showToast('+5 Points รับสำเร็จ!', 'success');
    }

    setTimeout(() => {
      window.location.href = 'pages/home.html';
    }, 800);
  }
</script>
</body>
</html>
