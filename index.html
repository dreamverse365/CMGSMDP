<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CMG Store Manager Development Program</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="images/bg.png">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .brand__img {
      width: 220px;
      max-width: 70vw;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    html, body {
      height: auto;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: 0 !important;
    }

    /* ── BACKGROUND ─────────────────────────── */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f5f5f5;
      background-image: url('images/bg.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      overflow: hidden;
    }

    /* ปิดเอฟเฟกต์พื้นหลังเดิม เพื่อให้แสดงภาพ bg.png โดยไม่ถูกสี/เส้นทับ */
    .bg-layer__blob,
    .bg-layer__lines,
    .bg-layer__vignette {
      display: none;
    }

    /* Animated aurora blobs */
    .bg-layer__blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      will-change: transform;
    }

    .bg-layer__blob--1 {
      width: 600px; height: 520px;
      background: radial-gradient(ellipse, rgba(186,43,43,0.13) 0%, transparent 70%);
      top: -120px; right: -100px;
      animation: blobDrift1 10s ease-in-out infinite;
    }
    .bg-layer__blob--2 {
      width: 440px; height: 380px;
      background: radial-gradient(ellipse, rgba(186,43,43,0.08) 0%, transparent 70%);
      bottom: -80px; left: -60px;
      animation: blobDrift2 13s ease-in-out infinite;
    }
    .bg-layer__blob--3 {
      width: 320px; height: 300px;
      background: radial-gradient(ellipse, rgba(201,168,76,0.07) 0%, transparent 70%);
      bottom: 40px; right: 60px;
      animation: blobDrift3 16s ease-in-out infinite;
    }

    /* Sliding diagonal lines */
    .bg-layer__lines {
      position: absolute;
      inset: -100%;
      width: 300%; height: 300%;
      background-image: repeating-linear-gradient(
        -52deg,
        transparent,
        transparent 90px,
        rgba(186,43,43,0.022) 90px,
        rgba(186,43,43,0.022) 91px
      );
      animation: slideLines 20s linear infinite;
    }

    /* Top vignette pulse */
    .bg-layer__vignette {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 200px;
      background: linear-gradient(180deg, rgba(186,43,43,0.055) 0%, transparent 100%);
      animation: vigPulse 6s ease-in-out infinite;
    }

    @keyframes blobDrift1 {
      0%,100% { transform: translate(0, 0) scale(1); }
      33%     { transform: translate(-28px, 22px) scale(1.06); }
      66%     { transform: translate(18px, -20px) scale(0.95); }
    }
    @keyframes blobDrift2 {
      0%,100% { transform: translate(0, 0) scale(1); }
      40%     { transform: translate(22px, -18px) scale(1.08); }
      70%     { transform: translate(-14px, 20px) scale(0.96); }
    }
    @keyframes blobDrift3 {
      0%,100% { transform: translate(0, 0) scale(1); }
      50%     { transform: translate(-18px, -14px) scale(1.05); }
    }
    @keyframes slideLines {
      from { transform: translateX(0); }
      to   { transform: translateX(33.33%); }
    }
    @keyframes vigPulse {
      0%,100% { opacity: 0.55; }
      50%     { opacity: 1; }
    }

    /* ── LAYOUT ─────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(32px, env(safe-area-inset-top, 32px))
        20px
        max(32px, env(safe-area-inset-bottom, 32px));
    }

    /* ── BRAND ──────────────────────────────── */
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand__eyebrow {
      font-family: 'Manrope', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: var(--brand);
      margin-bottom: 12px;
    }

    .brand__logo {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(26px, 7vw, 36px);
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #252525;
      line-height: 1;
    }

    .brand__logo span { color: var(--brand); }

    .brand__sub {
      font-family: 'Manrope', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: var(--text-2);
      margin-top: 8px;
    }

    .brand__divider {
      width: 44px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 14px auto 0;
    }

    /* ── CARD ───────────────────────────────── */
    .card {
      position: relative;
      width: 100%;
      max-width: 380px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(25,25,25,0.09);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow:
        0 0 0 1px rgba(186,43,43,0.025),
        0 22px 60px rgba(25,25,25,0.10),
        0 1px 0 rgba(255,255,255,0.90) inset;
      animation: cardFloat 6s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-5px); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 32px;
      right: 32px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--brand) 30%, #e05555 65%, transparent);
      border-radius: 0 0 4px 4px;
      animation: barGlow 5s ease-in-out infinite;
    }

    @keyframes barGlow {
      0%,100% { opacity: 0.7; }
      50%     { opacity: 1; filter: drop-shadow(0 1px 6px rgba(186,43,43,0.45)); }
    }

    .card__title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }

    /* ── FORM ───────────────────────────────── */
    .field { margin-bottom: 16px; }

    .field__label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    .field__input-wrap { position: relative; }

    .field__icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #969696;
      pointer-events: none;
      transition: color 0.2s;
    }

    .field__input-wrap:focus-within .field__icon { color: var(--brand); }

    input {
      width: 100%;
      background: #f5f5f5;
      border: 1px solid rgba(25,25,25,0.11);
      border-radius: var(--radius);
      padding: 13px 14px 13px 42px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      box-shadow: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      -webkit-appearance: none;
      letter-spacing: 0.05em;
    }

    input::placeholder { color: #a0a0a0; letter-spacing: 0; }

    input:hover {
      background: #ffffff;
      border-color: rgba(25,25,25,0.18);
    }

    input:focus {
      background: #ffffff;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(186,43,43,0.10);
    }

    input.input--error { border-color: var(--error); background: #fffafa; }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px #f5f5f5 inset;
      box-shadow: 0 0 0 1000px #f5f5f5 inset;
      caret-color: var(--text);
      transition: background-color 9999s ease-in-out 0s;
    }

    /* ── BUTTON ─────────────────────────────── */
    .btn-login {
      width: 100%;
      min-height: 50px;
      margin-top: 8px;
      padding: 15px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%);
      border: none;
      border-radius: var(--radius);
      font-family: 'Prompt', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 9px 22px rgba(186,43,43,0.22);
      transition: background 0.2s, box-shadow 0.2s, opacity 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, var(--brand-hover) 0%, var(--brand) 100%);
      box-shadow: 0 11px 26px rgba(186,43,43,0.27);
    }

    .btn-login:active { transform: scale(0.98); }

    .btn-login:disabled {
      background: #c98a8a;
      box-shadow: none;
      opacity: 0.72;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login__spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.38);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    .btn-login.loading .btn-login__text { display: none; }
    .btn-login.loading .btn-login__spinner { display: block; }

    /* ── ERROR MSG ───────────────────────────── */
    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--error-soft);
      border: 1px solid rgba(186,43,43,0.22);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--error);
    }

    .error-msg.visible { display: flex; }

    /* ── HINT ───────────────────────────────── */
    .hint {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: var(--text-3);
      line-height: 1.6;
    }

    /* ── TOAST ───────────────────────────────── */
    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(255,255,255,0.98);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 9999;
      max-width: 90vw;
      white-space: normal;
      text-align: center;
      box-shadow: 0 12px 34px rgba(25,25,25,0.13);
    }

    .toast--show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast--success { color: var(--success); background: var(--success-soft); border-color: rgba(38,117,81,0.25); }
    .toast--error   { color: var(--error);   background: var(--error-soft);   border-color: rgba(186,43,43,0.25); }

    /* ── OVERLAY ─────────────────────────────── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(25,25,25,0.50);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .overlay.visible { display: flex; }

    .overlay__card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 32px 80px rgba(25,25,25,0.22);
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    .overlay__icon {
      width: 56px;
      height: 56px;
      background: var(--brand-soft);
      border: 1px solid rgba(186,43,43,0.20);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .overlay__icon svg { width: 24px; height: 24px; color: var(--brand); }

    .overlay__title {
      font-family: 'Prompt', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .overlay__body {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .overlay__point {
      font-family: 'Manrope', sans-serif;
      font-size: 42px;
      font-weight: 800;
      color: var(--gold-dark);
      line-height: 1;
      margin: 16px 0 4px;
    }

    .overlay__point-label {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 28px;
      letter-spacing: 0.1em;
    }

    .btn-confirm {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%);
      border: none;
      border-radius: var(--radius);
      font-family: 'Prompt', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 9px 22px rgba(186,43,43,0.20);
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-confirm:hover {
      background: linear-gradient(135deg, var(--brand-hover) 0%, var(--brand) 100%);
    }

    /* ── ANIMATIONS ─────────────────────────── */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9) translateY(10px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }

    /* ── RESPONSIVE ─────────────────────────── */
    @media (max-width: 420px) {
      .card { padding: 28px 22px; }
      .card::before { left: 22px; right: 22px; }
      .page { padding-inline: 18px; }
    }

    @media (max-height: 680px) {
      .brand { margin-bottom: 20px; }
      .brand__logo { font-size: 24px; }
      .card { padding: 24px 22px; }
      .card__title { margin-bottom: 20px; }
      .field { margin-bottom: 12px; }
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      .bg-layer__blob,
      .bg-layer__lines,
      .bg-layer__vignette,
      .card,
      .card::before { animation: none; }
    }
  </style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-layer__blob bg-layer__blob--1"></div>
  <div class="bg-layer__blob bg-layer__blob--2"></div>
  <div class="bg-layer__blob bg-layer__blob--3"></div>
  <div class="bg-layer__lines"></div>
  <div class="bg-layer__vignette"></div>
</div>

<div class="page">

  <!-- Brand -->
  <div class="brand">
    <img 
      src="images/logo.png" 
      alt="CMG Store Manager Development Program"
      class="brand__img"
    >
  </div>

  <!-- Login Card -->
  <div class="card">
    <p class="card__title">เข้าสู่ระบบ</p>

    <div class="field">
      <label class="field__label" for="empId">EMPLOYEE ID</label>
      <div class="field__input-wrap">
        <input
          id="empId"
          type="text"
          inputmode="numeric"
          placeholder="2XXXXXXX"
          maxlength="8"
          autocomplete="username"
        >
        <svg class="field__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="10" cy="6.5" r="3.5"/>
          <path d="M3 17c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="pin">รหัสผ่าน (เลขบัตรประชาชน 4 ตัวท้าย)</label>
      <div class="field__input-wrap">
        <input
          id="pin"
          type="password"
          inputmode="numeric"
          placeholder="••••"
          maxlength="4"
          autocomplete="current-password"
        >
        <svg class="field__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="4" y="9" width="12" height="9" rx="2"/>
          <path d="M7 9V6.5a3 3 0 1 1 6 0V9" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      <span class="btn-login__text">เข้าสู่ระบบ</span>
      <div class="btn-login__spinner"></div>
    </button>

    <div class="error-msg" id="errorMsg">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
      </svg>
      <span id="errorText"></span>
    </div>
  </div>

  <p class="hint">CMG Store Manager Development Program &copy; 2026</p>

</div>

<!-- First Login Bonus Overlay -->
<div class="overlay" id="bonusOverlay">
  <div class="overlay__card">
    <div class="overlay__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 class="overlay__title">ยินดีต้อนรับ!</h2>
    <p class="overlay__body">คุณเข้าสู่ระบบครั้งแรก<br>รับโบนัสพิเศษทันที</p>
    <div class="overlay__point">+5</div>
    <p class="overlay__point-label">POINTS</p>
    <button class="btn-confirm" onclick="confirmBonus()">รับ Point เลย</button>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  if (Session.get()) {
    window.location.href = 'pages/home.html';
  }

  document.getElementById('empId').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8);
    clearError();
  });

  document.getElementById('pin').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
    clearError();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });

  function setLoading(state) {
    const btn = document.getElementById('loginBtn');
    btn.disabled = state;
    btn.classList.toggle('loading', state);
  }

  function showError(msg) {
    const box = document.getElementById('errorMsg');
    document.getElementById('errorText').textContent = msg;
    box.classList.add('visible');
    document.getElementById('empId').classList.add('input--error');
    document.getElementById('pin').classList.add('input--error');
  }

  function clearError() {
    document.getElementById('errorMsg').classList.remove('visible');
    document.getElementById('empId').classList.remove('input--error');
    document.getElementById('pin').classList.remove('input--error');
  }

  async function handleLogin() {
    const empId = document.getElementById('empId').value.trim();
    const pin   = document.getElementById('pin').value.trim();

    if (!empId || !pin) {
      showError('กรุณากรอก Employee ID และรหัสผ่าน');
      return;
    }
    if (!/^2\d{7}$/.test(empId)) {
      showError('Employee ID ต้องขึ้นต้นด้วย 2 และมี 8 หลัก');
      return;
    }
    if (pin.length !== 4) {
      showError('รหัสผ่านต้องเป็นตัวเลข 4 หลัก');
      return;
    }

    setLoading(true);
    clearError();

    const result = await api('login', { empId, pin });

    setLoading(false);

    if (!result.success) {
      showError(result.message || 'เข้าสู่ระบบไม่สำเร็จ');
      return;
    }

    Session.save(result.user);

    if (!result.user.firstLogin) {
      document.getElementById('bonusOverlay').classList.add('visible');
    } else {
      window.location.href = 'pages/home.html';
    }
  }

  async function confirmBonus() {
    const session = Session.get();
    if (!session) return;

    const result = await api('firstLoginBonus', { empId: session.empId });

    if (result.success) {
      session.availablePoint = result.newAvailable;
      session.totalPoint = result.newTotal;
      Session.save(session);
      showToast('+5 Points รับสำเร็จ!', 'success');
    }

    setTimeout(() => {
      window.location.href = 'pages/home.html';
    }, 800);
  }
</script>
</body>
</html>
