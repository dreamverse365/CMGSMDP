<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Knowledge — CMG SMDP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
  <style>
    body::before {
      content: '';
      position: fixed; top: -20%; left: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(186,43,43,0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .page-body { position: relative; z-index: 1; }

    /* ── INTRO ── */
    .knowledge-intro { margin: 4px 0 24px; }
    .knowledge-eyebrow {
      color: var(--brand);
      font: 700 10px/1 'Manrope', sans-serif;
      letter-spacing: .18em; margin-bottom: 9px;
    }
    .knowledge-title {
      font: 800 clamp(25px, 7vw, 34px)/1.15 'Manrope', sans-serif;
      letter-spacing: -.03em; margin-bottom: 9px;
      color: var(--text);
    }
    .knowledge-copy { color: var(--text-2); font-size: 13px; line-height: 1.65; }

    /* ── SEARCH ── */
    button, input, select { font: inherit; }
    .knowledge-search {
      display: grid; grid-template-columns: 1fr 130px;
      gap: 9px; margin-bottom: 18px;
    }
    .knowledge-search input,
    .knowledge-search select {
      min-height: 44px; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--text);
      transition: border-color .2s;
    }
    .knowledge-search input:focus,
    .knowledge-search select:focus {
      outline: none; border-color: var(--brand);
    }

    /* ── CARDS ── */
    .knowledge-grid { display: grid; gap: 10px; }
    .knowledge-card {
      display: grid; grid-template-columns: 48px 1fr 28px;
      gap: 13px; align-items: center;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      text-decoration: none;
      box-shadow: 0 7px 22px rgba(25,25,25,.04);
      transition: border-color .2s, box-shadow .2s, transform .15s;
    }
    .knowledge-card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .knowledge-card:active { transform: scale(.99); }

    .file-icon {
      width: 48px; height: 48px;
      display: grid; place-items: center;
      border-radius: 12px;
      background: var(--brand-dim); color: var(--brand);
    }
    .file-icon svg { width: 23px; height: 23px; }

    .knowledge-item-title {
      color: var(--text);
      font: 600 14px/1.45 'Manrope', sans-serif;
    }
    .knowledge-desc {
      margin-top: 3px; color: var(--text-3);
      font-size: 11px; line-height: 1.55;
    }
    .knowledge-meta {
      display: flex; flex-wrap: wrap;
      gap: 6px; margin-top: 8px;
    }
    .knowledge-tag {
      padding: 3px 8px; border-radius: 99px;
      background: var(--surface-2); color: var(--text-2);
      font-size: 9px; font-weight: 700; letter-spacing: .06em;
      border: 1px solid var(--border);
    }
    .open-icon { color: var(--text-3); }
    .open-icon svg { width: 18px; height: 18px; }

    /* ── MISC ── */
    .page-header__back { min-width: 44px; min-height: 44px; }
    .nav-item { min-height: 48px; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--brand); outline-offset: 3px;
    }

    @media (max-width: 380px) {
      .knowledge-search { grid-template-columns: 1fr; }
      .knowledge-card { grid-template-columns: 42px 1fr 22px; }
      .file-icon { width: 42px; height: 42px; }
    }
    @media (max-width: 360px) {
      .page-body { padding-inline: 16px; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <button class="page-header__back" type="button" onclick="location.href='home.html'" aria-label="กลับหน้าหลัก">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M13 4l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </button>
    <div class="page-header__title">KNOWLEDGE</div>
    <div style="width:44px" aria-hidden="true"></div>
  </header>

  <main class="page-body">
    <section class="knowledge-intro" aria-labelledby="knowledgeTitle">
      <div class="knowledge-eyebrow">LEARNING JOURNEY</div>
      <h1 class="knowledge-title" id="knowledgeTitle">Knowledge Base</h1>
      <p class="knowledge-copy">คลังความรู้สำหรับการพัฒนา</p>
    </section>

    <div class="knowledge-search">
      <input id="searchInput" type="search" placeholder="ค้นหาชื่อหรือรายละเอียด">
      <select id="categoryFilter"><option value="ALL">ทุกหมวดหมู่</option></select>
    </div>
    <div class="knowledge-grid" id="knowledgeList">
      <div class="empty-state">
        <div class="skeleton" style="width:100%;height:80px"></div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item" href="home.html">
      <div class="nav-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 12L12 3l9 9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 21V12h6v9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="nav-item__label">Home</span>
    </a>
    <a class="nav-item" href="calendar.html">
      <div class="nav-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="18" rx="3"/>
          <path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="nav-item__label">Calendar</span>
    </a>
    <a class="nav-item" href="ranking.html">
      <div class="nav-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M18 20V10M12 20V4M6 20v-6" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="nav-item__label">Ranking</span>
    </a>
    <a class="nav-item" href="redeem.html">
      <div class="nav-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7M22 7H2v5h20V7zM12 22V7"/>
        </svg>
      </div>
      <span class="nav-item__label">Redeem</span>
    </a>
    <a class="nav-item active" href="knowledge.html">
      <div class="nav-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" stroke-linejoin="round"/>
          <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="nav-item__label">Knowledge</span>
    </a>
  </nav>

  <script src="../js/config.js"></script>
  <script>
    const session = Session.get();
    if (!session) location.href = '../index.html';
    let knowledge = [];

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
      } catch (_) { return ''; }
    }

    function fillCategories() {
      const select = document.getElementById('categoryFilter');
      [...new Set(knowledge.map(x => String(x.Category || '').trim()).filter(Boolean))]
        .sort()
        .forEach(x => select.add(new Option(x, x)));
    }

    function render() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const category = document.getElementById('categoryFilter').value;
      const list = knowledge.filter(x =>
        (category === 'ALL' || String(x.Category) === category) &&
        (!q || [x.Title, x.Description, x.Category].join(' ').toLowerCase().includes(q))
      );
      const box = document.getElementById('knowledgeList');
      box.replaceChildren();
      if (!list.length) {
        box.innerHTML = '<div class="empty-state"><p>ไม่พบรายการความรู้</p></div>';
        return;
      }
      list.forEach(item => {
        const url = safeUrl(item.FileURL);
        const card = document.createElement(url ? 'a' : 'div');
        card.className = 'knowledge-card';
        if (url) { card.href = url; card.target = '_blank'; card.rel = 'noopener noreferrer'; }
        card.innerHTML = `
          <div class="file-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M6 2h8l4 4v16H6z" stroke-linejoin="round"/>
              <path d="M14 2v5h5M9 12h6M9 16h6" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <div class="knowledge-item-title"></div>
            <div class="knowledge-desc"></div>
            <div class="knowledge-meta">
              <span class="knowledge-tag"></span>
              <span class="knowledge-tag"></span>
            </div>
          </div>
          <div class="open-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M14 5h5v5M19 5l-8 8M18 13v6H5V6h6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>`;
        card.querySelector('.knowledge-item-title').textContent = item.Title || 'Untitled';
        card.querySelector('.knowledge-desc').textContent = item.Description || '';
        const tags = card.querySelectorAll('.knowledge-tag');
        tags[0].textContent = item.Category || 'General';
        tags[1].textContent = item.FileType || 'File';
        box.appendChild(card);
      });
    }

    async function loadKnowledge() {
      const result = await api('getKnowledge', { empId: session.empId });
      if (!result.success) {
        const box = document.getElementById('knowledgeList');
        box.innerHTML = `<div class="empty-state"><p>${result.message || 'โหลดข้อมูลไม่สำเร็จ'}</p><button class="btn btn--ghost" onclick="loadKnowledge()">ลองใหม่</button></div>`;
        return;
      }
      knowledge = Array.isArray(result.knowledge) ? result.knowledge : [];
      fillCategories();
      render();
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('categoryFilter').addEventListener('change', render);
    if (session) loadKnowledge();
  </script>
</body>
</html>
