<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CMG SMDP — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --brand:       #ba2b2b;
      --brand-light: #d94444;
      --brand-dim:   rgba(186,43,43,0.08);
      --brand-soft:  rgba(186,43,43,0.08);

      --gold:        #c9a84c;
      --gold-dark:   #84651d;
      --gold-dim:    rgba(201,168,76,0.12);
      --gold-soft:   rgba(201,168,76,0.12);
      --gold-light:  #e0c06a;

      --success:      #267551;
      --success-soft: rgba(38,117,81,0.1);
      --info:         #426f9e;
      --info-soft:    rgba(66,111,158,0.1);

      --bg:        #f7f7f8;
      --surface:   #ffffff;
      --surface-2: #f4f4f6;
      --surface-3: #e8e8ec;

      --border:       rgba(0,0,0,0.08);
      --border-hover: rgba(186,43,43,0.2);

      --text:   #1a1a1a;
      --text-2: #606060;
      --text-3: #8b8b8b;

      --radius-sm: 8px;
      --radius-lg: 14px;
      --radius-xl: 18px;

      --shadow: 0 4px 20px rgba(0,0,0,0.08);

      box-sizing: border-box;
    }

    *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Prompt', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      padding-top: env(safe-area-inset-top, 0px);
    }

    body::before {
      content: '';
      position: fixed; top: -20%; left: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(186,43,43,0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px;
      background: rgba(247,247,248,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      min-height: 54px;
    }

    .header-logo {
      display: inline-flex;
      align-items: center;
      height: 34px;
      text-decoration: none;
    }

    .header-logo img {
      display: block;
      width: auto;
      height: 30px;
      max-width: 145px;
      object-fit: contain;
    }

    /* ── LOGOUT BUTTON (top-right) ── */
    .logout-btn {
      display: flex; align-items: center; gap: 5px;
      background: none; border: none; cursor: pointer;
      color: var(--text-3);
      font-size: 12px; font-weight: 500;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .logout-btn:hover {
      color: var(--brand);
      background: var(--brand-dim);
    }
    .logout-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* ── PAGE BODY ── */
    .page-body {
      position: relative; z-index: 1;
      padding: 20px 16px 8px;
      max-width: 480px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-3);
      margin-bottom: 10px;
      margin-top: 4px;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 50%, var(--surface-3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── HERO CARD ── */
    .hero-card {
      background: linear-gradient(145deg, #ffffff 0%, #fdf5f5 100%);
      border: 1px solid rgba(186,43,43,0.12);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(186,43,43,0.04),
        0 12px 40px rgba(25,25,25,0.07);
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
      border-radius: 0 0 4px 4px;
    }

    .hero-card::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(186,43,43,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(186,43,43,0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .hero-brand {
      font-family: 'Manrope', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--brand);
      margin-bottom: 4px;
    }

    .hero-name {
      font-family: 'Manrope', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.15;
    }

    .hero-sub {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 4px;
      line-height: 1.5;
    }

    .hero-avatar {
      width: 44px; height: 44px;
      background: var(--brand-soft);
      border: 1.5px solid rgba(186,43,43,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-family: 'Manrope', sans-serif;
      font-size: 16px; font-weight: 800;
      color: var(--brand);
    }

    .point-display {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding-top: 18px;
      border-top: 1px solid rgba(186,43,43,0.1);
      position: relative;
      z-index: 1;
    }

    .point-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--text-3);
      margin-bottom: 4px;
    }

    .point-value {
      font-family: 'Manrope', sans-serif;
      font-size: 44px;
      font-weight: 800;
      color: var(--gold-dark);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .point-unit {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      margin-left: 4px;
      vertical-align: bottom;
      line-height: 2.2;
    }

    .point-secondary { text-align: right; }

    .point-secondary-item {
      font-size: 11px;
      color: var(--text-3);
      margin-bottom: 2px;
      line-height: 1.6;
    }

    .point-secondary-item span {
      color: var(--text-2);
      font-weight: 600;
    }

    .progress-wrap {
      margin-top: 16px;
      position: relative;
      z-index: 1;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-3);
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 5px;
      background: var(--surface-3);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar__fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand) 0%, var(--brand-light) 100%);
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }

    .history-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer;
      color: var(--text-3); font-size: 12px;
      padding: 4px 0; margin-top: 12px;
      position: relative; z-index: 1;
      transition: color 0.2s;
    }
    .history-btn svg { width: 14px; height: 14px; }
    .history-btn:hover { color: var(--brand); }

    /* ── FLASH CARDS GRID ── */
    .flashcard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .flashcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 18px;
      cursor: pointer;
      text-decoration: none;
      display: flex; flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .flashcard:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .flashcard:active { transform: scale(0.97); }

    .flashcard--calendar .flashcard__icon-wrap { background: rgba(66,111,158,0.1); }
    .flashcard--calendar .flashcard__icon      { color: var(--info); }
    .flashcard--ranking .flashcard__icon-wrap  { background: var(--gold-dim); }
    .flashcard--ranking .flashcard__icon       { color: var(--gold-dark); }
    .flashcard--redeem .flashcard__icon-wrap   { background: rgba(38,117,81,0.1); }
    .flashcard--redeem .flashcard__icon        { color: var(--success); }
    .flashcard--knowledge .flashcard__icon-wrap { background: var(--brand-dim); }
    .flashcard--knowledge .flashcard__icon      { color: var(--brand); }

    .flashcard__icon-wrap {
      width: 40px; height: 40px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .flashcard__icon { width: 20px; height: 20px; }

    .flashcard__label {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .flashcard__sub {
      font-size: 11px;
      color: var(--text-2);
      margin-top: 2px;
      line-height: 1.4;
    }

    /* ── UPCOMING SECTION ── */
    .upcoming-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .upcoming-item {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }
    .upcoming-item:last-child { border-bottom: none; }
    .upcoming-item:hover { background: var(--surface-2); }

    .upcoming-date-block {
      width: 40px; flex-shrink: 0;
      text-align: center;
    }

    .upcoming-date-day {
      font-family: 'Manrope', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--brand);
      line-height: 1;
    }

    .upcoming-date-month {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-3);
      margin-top: 2px;
    }

    .upcoming-vline {
      width: 1px; height: 36px;
      background: var(--border);
      flex-shrink: 0;
    }

    .upcoming-info { flex: 1; min-width: 0; }

    .upcoming-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .upcoming-meta {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 3px;
    }

    .upcoming-format {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .upcoming-format--classroom {
      background: rgba(66,111,158,0.1);
      color: var(--info);
    }

    .upcoming-format--online {
      background: rgba(38,117,81,0.1);
      color: var(--success);
    }

    /* ── BOTTOM SHEET / OVERLAY ── */
    .overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.35);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
      display: flex; align-items: flex-end;
    }
    .overlay.visible {
      opacity: 1; pointer-events: all;
    }

    .bottom-sheet {
      width: 100%;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 12px 20px 32px;
      max-height: 70vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    }
    .overlay.visible .bottom-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--surface-3);
      border-radius: 4px;
      margin: 0 auto 16px;
    }

    .history-list { display: flex; flex-direction: column; gap: 0; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .history-item:last-child { border-bottom: none; }

    .history-icon {
      width: 36px; height: 36px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .history-icon svg { width: 16px; height: 16px; }

    .history-icon--earn       { background: var(--success-soft); color: var(--success); }
    .history-icon--redeem     { background: var(--gold-soft);    color: var(--gold-dark); }
    .history-icon--admin,
    .history-icon--admin_edit { background: var(--info-soft);    color: var(--info); }

    .history-info { flex: 1; min-width: 0; }

    .history-reason {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-date {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .history-pt {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .history-pt--pos { color: var(--success); }
    .history-pt--neg { color: var(--gold-dark); }

    .sheet-title {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 20px;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-3);
      font-size: 13px;
    }

    .empty-state svg {
      width: 32px; height: 32px;
      margin-bottom: 12px;
      opacity: 0.35;
    }

    .sk-name { width: 140px; height: 22px; margin-bottom: 6px; display: block; }
    .sk-sub  { width: 100px; height: 14px; margin-top: 6px; display: block; }
  </style>
</head>
<body>

<!-- PAGE HEADER -->
<header class="page-header">
  <a href="home.html" class="header-logo" aria-label="CMG SMDP Home">
    <img src="../images/logo.png" alt="CMG Store Manager Development Program">
  </a>

  <button class="logout-btn" onclick="logout()">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M13 3h4a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-4M9 14l4-4-4-4M13 10H3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Logout
  </button>
</header>

<!-- MAIN -->
<main class="page-body">

  <!-- Hero Card -->
  <div class="hero-card" id="heroCard">
    <div class="hero-top">
      <div>
        <div class="hero-brand" id="heroBrand">LOADING...</div>
        <div class="hero-name" id="heroName">
          <span class="skeleton sk-name"></span>
        </div>
        <div class="hero-sub" id="heroSub">
          <span class="skeleton sk-sub"></span>
        </div>
      </div>
      <div class="hero-avatar" id="heroAvatar">?</div>
    </div>

    <div class="point-display">
      <div class="point-block">
        <div class="point-label">POINTS สะสม</div>
        <div>
          <span class="point-value" id="totalPoint">—</span>
          <span class="point-unit">pts</span>
        </div>
      </div>
      <div class="point-secondary">
        <div class="point-secondary-item">ใช้แลกได้ <span id="availPoint">—</span> pts</div>
        <div class="point-secondary-item">แลกไปแล้ว <span id="redeemPoint">—</span> pts</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-labels">
        <span>Journey Progress</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-bar__fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <button class="history-btn" onclick="openHistory()">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="10" cy="10" r="8"/>
        <path d="M10 6v4l2.5 2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Point History
    </button>
  </div>

  <!-- Flash Cards -->
  <div class="flashcard-grid">

    <a class="flashcard flashcard--calendar" href="calendar.html">
      <div class="flashcard__icon-wrap">
        <svg class="flashcard__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="18" rx="3"/>
          <path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round"/>
          <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" stroke-linecap="round" stroke-width="2"/>
        </svg>
      </div>
      <div>
        <div class="flashcard__label">Calendar</div>
        <div class="flashcard__sub">ตารางอบรมและแบบทดสอบ</div>
      </div>
    </a>

    <a class="flashcard flashcard--ranking" href="ranking.html">
      <div class="flashcard__icon-wrap">
        <svg class="flashcard__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M18 20V10M12 20V4M6 20v-6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="flashcard__label">Ranking</div>
        <div class="flashcard__sub">Top 10 คะแนนสูงสุด</div>
      </div>
    </a>

    <a class="flashcard flashcard--redeem" href="redeem.html">
      <div class="flashcard__icon-wrap">
        <svg class="flashcard__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7M22 7H2v5h20V7zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
        </svg>
      </div>
      <div>
        <div class="flashcard__label">Redeem</div>
        <div class="flashcard__sub">แลก Gift Card</div>
      </div>
    </a>

    <a class="flashcard flashcard--knowledge" href="knowledge.html">
      <div class="flashcard__icon-wrap">
        <svg class="flashcard__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" stroke-linejoin="round"/>
          <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="flashcard__label">Knowledge</div>
        <div class="flashcard__sub">คลังความรู้</div>
      </div>
    </a>

  </div>

</main>

  <a class="nav-item" href="ranking.html">

    </div>

  <a class="nav-item" href="redeem.html">
    <div class="nav-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

      </svg>

    <span class="nav-item__label">Redeem</span>

  <a class="nav-item" href="knowledge.html">
    <div class="nav-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" stroke-linejoin="round"/>
        <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="nav-item__label">Knowledge</span>
  </a>
</nav>

<!-- HISTORY BOTTOM SHEET -->
<div class="overlay" id="historyOverlay" onclick="closeHistory(event)">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <h3 class="sheet-title">ประวัติ Point</h3>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script src="../js/config.js"></script>
<script>
const MAX_PROG = 300;

const MONTH_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function formatDate(isoStr) {
  const d = new Date(isoStr);
  return `${d.getDate()} ${MONTH_TH[d.getMonth()]} ${d.getFullYear() + 543}`;
}

function formatDateTime(isoStr) {
  const d = new Date(isoStr);
  return `${d.getDate()} ${MONTH_TH[d.getMonth()]} ${d.getFullYear() + 543}  ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

const session = Session.require();

function renderHero(user) {
  const initial = (user.firstname || '?')[0].toUpperCase();
  document.getElementById('heroAvatar').textContent = initial;
  document.getElementById('heroBrand').textContent = (user.brandName || '') + ' · ' + (user.workLocation || '');
  document.getElementById('heroName').textContent = user.firstname + ' ' + user.lastname;
  document.getElementById('heroSub').textContent = user.functionName || '';

  const total  = Number(user.totalPoint) || 0;
  const avail  = Number(user.availablePoint) || 0;
  const redeem = total - avail;
  const pct    = Math.min(Math.round((total / MAX_PROG) * 100), 100);

  document.getElementById('totalPoint').textContent  = total.toLocaleString();
  document.getElementById('availPoint').textContent  = avail.toLocaleString();
  document.getElementById('redeemPoint').textContent = redeem.toLocaleString();
  document.getElementById('progressPct').textContent = pct + '%';

  requestAnimationFrame(() => {
    setTimeout(() => {
      document.getElementById('progressFill').style.width = pct + '%';
    }, 100);
  });
}

renderHero(session);

async function refreshProfile() {
  const result = await api('getUserProfile', { empId: session.empId });
  if (result.success) {
    Object.assign(session, result.user);
    Session.save(session);
    renderHero(result.user);
  }
}

async function loadUpcoming() {
  const result = await api('getCourses');
  const container = document.getElementById('upcomingList');
  if (!container) return;

  if (!result.success || !result.courses?.length) {
    container.innerHTML = '<div class="empty-state"><p>ยังไม่มีหลักสูตร</p></div>';
    return;
  }

  const now = new Date();
  const upcoming = result.courses
    .filter(c => new Date(c.Date) >= now)
    .sort((a, b) => new Date(a.Date) - new Date(b.Date))
    .slice(0, 3);

  if (!upcoming.length) {
    container.innerHTML = '<div class="empty-state"><p>ไม่มีหลักสูตรที่กำลังจะมาถึง</p></div>';
    return;
  }

  container.innerHTML = upcoming.map(c => {
    const d = new Date(c.Date);
    const day = d.getDate();
    const month = MONTH_TH[d.getMonth()];
    const fmtClass = c.Format === 'online' ? 'upcoming-format--online' : 'upcoming-format--classroom';
    const fmtLabel = c.Format === 'online' ? 'Online' : 'Classroom';
    return `
      <div class="upcoming-item">
        <div class="upcoming-date-block">
          <div class="upcoming-date-day">${day}</div>
          <div class="upcoming-date-month">${month}</div>
        </div>
        <div class="upcoming-vline"></div>
        <div class="upcoming-info">
          <div class="upcoming-name">${c.CourseName}</div>
          <div class="upcoming-meta">${c.Time || ''} · ${c.Location || ''}</div>
        </div>
        <span class="upcoming-format ${fmtClass}">${fmtLabel}</span>
      </div>`;
  }).join('');
}

let historyLoaded = false;

async function openHistory() {
  document.getElementById('historyOverlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
  if (historyLoaded) return;
  historyLoaded = true;

  const list = document.getElementById('historyList');
  list.innerHTML = '<div style="padding:20px 0;text-align:center;color:var(--text-3);font-size:13px;">กำลังโหลด...</div>';

  const result = await api('getPointHistory', { empId: session.empId });

  if (!result.success || !result.history?.length) {
    list.innerHTML = '<div class="empty-state"><p>ยังไม่มีประวัติ Point</p></div>';
    return;
  }

  const iconMap = {
    earn: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4v12M4 10l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    redeem: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4v12M4 14l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    admin: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M10 7v3l2 2" stroke-linecap="round"/></svg>`,
    admin_edit: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 3.5l2 2L7 15l-3 1 1-3 9.5-9.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  };

  list.innerHTML = result.history.map(h => {
    const ptNum = Number(h.Point);
    const isPos = ptNum >= 0;
    const icon = iconMap[h.Type] || iconMap.earn;
    const iconClass = `history-icon--${h.Type || 'earn'}`;
    return `
      <div class="history-item">
        <div class="history-icon ${iconClass}">${icon}</div>
        <div class="history-info">
          <div class="history-reason">${h.Reason}</div>
          <div class="history-date">${formatDateTime(h.Date)}</div>
        </div>
        <div class="history-pt ${isPos ? 'history-pt--pos' : 'history-pt--neg'}">
          ${isPos ? '+' : ''}${ptNum}
        </div>
      </div>`;
  }).join('');
}

function closeHistory(e) {
  document.getElementById('historyOverlay').classList.remove('visible');
  document.body.style.overflow = '';
}

function logout() {
  if (confirm('ออกจากระบบ?')) {
    Session.clear();
    window.location.href = '../index.html';
  }
}

refreshProfile();
loadUpcoming();
</script>
</body>
</html>
