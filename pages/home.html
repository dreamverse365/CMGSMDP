<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CMG SMDP — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
  <style>

    body::before {
      content: '';
      position: fixed; top: -20%; left: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(186,43,43,0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .page-body { position: relative; z-index: 1; }

    /* ── HERO CARD — light theme สอดคล้องกับ app.css ── */
    .hero-card {
      background: linear-gradient(145deg, #ffffff 0%, #fdf5f5 100%);
      border: 1px solid rgba(186,43,43,0.12);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(186,43,43,0.04),
        0 12px 40px rgba(25,25,25,0.07);
    }

    /* แถบแดงด้านบน */
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
      border-radius: 0 0 4px 4px;
    }

    /* grid texture */
    .hero-card::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(186,43,43,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(186,43,43,0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .hero-brand {
      font-family: 'Manrope', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--brand);
      margin-bottom: 4px;
    }

    .hero-name {
      font-family: 'Manrope', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);        /* #222 บน white → contrast ดี */
      line-height: 1.15;
    }

    .hero-sub {
      font-size: 12px;
      color: var(--text-2);      /* #606060 บน white → อ่านได้ */
      margin-top: 4px;
      line-height: 1.5;
    }

    .hero-avatar {
      width: 44px; height: 44px;
      background: var(--brand-soft);
      border: 1.5px solid rgba(186,43,43,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-family: 'Manrope', sans-serif;
      font-size: 16px; font-weight: 800;
      color: var(--brand);
    }

    /* Point Display */
    .point-display {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding-top: 18px;
      border-top: 1px solid rgba(186,43,43,0.1);
      position: relative;
      z-index: 1;
    }

    .point-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--text-3);      /* #8b8b8b บน white → ใช้ได้ */
      margin-bottom: 4px;
    }

    .point-value {
      font-family: 'Manrope', sans-serif;
      font-size: 44px;
      font-weight: 800;
      color: var(--gold-dark);   /* #84651d เข้มพอบน white */
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .point-unit {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      margin-left: 4px;
      vertical-align: bottom;
      line-height: 2.2;
    }

    .point-secondary { text-align: right; }

    .point-secondary-item {
      font-size: 11px;
      color: var(--text-3);
      margin-bottom: 2px;
      line-height: 1.6;
    }

    .point-secondary-item span {
      color: var(--text-2);
      font-weight: 600;
    }

    /* Progress */
    .progress-wrap {
      margin-top: 16px;
      position: relative;
      z-index: 1;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-3);
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 5px;
      background: var(--surface-3);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar__fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand) 0%, var(--brand-light) 100%);
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }

    .history-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer;
      color: var(--text-3); font-size: 12px;
      padding: 4px 0; margin-top: 12px;
      position: relative; z-index: 1;
      transition: color 0.2s;
    }
    .history-btn svg { width: 14px; height: 14px; }
    .history-btn:hover { color: var(--brand); }

    /* ── FLASH CARDS ── */
    .flashcard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .flashcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 18px;
      cursor: pointer;
      text-decoration: none;
      display: flex; flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .flashcard:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .flashcard:active { transform: scale(0.97); }

    .flashcard--calendar .flashcard__icon-wrap { background: rgba(66,111,158,0.1); }
    .flashcard--calendar .flashcard__icon      { color: var(--info); }

    .flashcard--ranking .flashcard__icon-wrap  { background: var(--gold-dim); }
    .flashcard--ranking .flashcard__icon       { color: var(--gold-dark); }

    .flashcard--redeem .flashcard__icon-wrap   { background: rgba(38,117,81,0.1); }
    .flashcard--redeem .flashcard__icon        { color: var(--success); }

    .flashcard--profile .flashcard__icon-wrap  { background: var(--brand-dim); }
    .flashcard--profile .flashcard__icon       { color: var(--brand); }

    .flashcard__icon-wrap {
      width: 40px; height: 40px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .flashcard__icon { width: 20px; height: 20px; }

    .flashcard__label {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);        /* #222 บน white card */
      line-height: 1.3;
    }

    .flashcard__sub {
      font-size: 11px;
      color: var(--text-2);      /* #606060 — เข้มพอ contrast OK */
      margin-top: 2px;
      line-height: 1.4;
    }

    /* ── POINT HISTORY ── */
    .history-list { display: flex; flex-direction: column; gap: 0; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .history-item:last-child { border-bottom: none; }

    .history-icon {
      width: 36px; height: 36px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .history-icon svg { width: 16px; height: 16px; }

    .history-icon--earn       { background: var(--success-soft); color: var(--success); }
    .history-icon--redeem     { background: var(--gold-soft);    color: var(--gold-dark); }
    .history-icon--admin,
    .history-icon--admin_edit { background: var(--info-soft);    color: var(--info); }

    .history-info { flex: 1; min-width: 0; }

    .history-reason {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-date {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .history-pt {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .history-pt--pos { color: var(--success); }
    .history-pt--neg { color: var(--gold-dark); }

    .sheet-title {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 20px;
    }

    /* ── SKELETONS ── */
    .sk-name { width: 140px; height: 22px; margin-bottom: 6px; }
    .sk-sub  { width: 100px; height: 14px; }
    .sk-pt   { width: 80px;  height: 44px; margin-bottom: 4px; }
    .sk-bar  { width: 100%;  height: 5px;  margin-top: 16px; }

  </style>
</head>
<body>

<!-- PAGE HEADER -->
<header class="page-header">
  <div>
    <div style="font-size:9px;letter-spacing:0.2em;color:var(--brand);font-weight:700;font-family:'Manrope',sans-serif;">CMG</div>
    <div style="font-family:'Manrope',sans-serif;font-size:13px;font-weight:800;letter-spacing:0.1em;color:var(--text);">SMDP</div>
  </div>
  <button onclick="logout()" style="background:none;border:none;cursor:pointer;color:var(--text-3);display:flex;align-items:center;gap:6px;font-size:12px;transition:color 0.2s;" onmouseover="this.style.color='var(--brand)'" onmouseout="this.style.color='var(--text-3)'">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M13 3h4a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-4M9 14l4-4-4-4M13 10H3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    ออกจากระบบ
  </button>
</header>

<!-- MAIN -->
<main class="page-body">

  <!-- Hero Card -->
  <div class="hero-card" id="heroCard">
    <div class="hero-top">
      <div>
        <div class="hero-brand" id="heroBrand">LOADING...</div>
        <div class="hero-name" id="heroName">
          <span class="skeleton sk-name" style="display:block"></span>
        </div>
        <div class="hero-sub" id="heroSub">
          <span class="skeleton sk-sub" style="display:block;margin-top:6px"></span>
        </div>
      </div>
      <div class="hero-avatar" id="heroAvatar">?</div>
    </div>

    <div class="point-display">
      <div class="point-block">
        <div class="point-label">POINTS สะสม</div>
        <div>
          <span class="point-value" id="totalPoint">—</span>
          <span class="point-unit">pts</span>
        </div>
      </div>
      <div class="point-secondary">
        <div class="point-secondary-item">ใช้แลกได้ <span id="availPoint">—</span> pts</div>
        <div class="point-secondary-item">แลกไปแล้ว <span id="redeemPoint">—</span> pts</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-labels">
        <span>Journey Progress</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-bar__fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <button class="history-btn" onclick="openHistory()">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="10" cy="10" r="8"/>
        <path d="M10 6v4l2.5 2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      ดูประวัติ Point
    </button>
  </div>

  <!-- Flash Cards -->
  <p class="section-label">เมนู</p>
  <div class="flashcard-grid">

    <a class="flashcard flashcard--calendar" href="calendar.html">
      <div class="flashcard__icon-wrap">
        <svg class="flashcard__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="18" rx="3"/>
          <path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round"/>
          <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" stroke-linecap="round" stroke-width="2"/>
        </svg>
      </div>
      <div>
        <div class="flashcard__label">Calendar</div>
        <div class="flashcard__sub">ตารางอบรม & แบบทดสอบ</div>
      </div>
    </a>

    <a class="flashcard flashcard--ranking" href="ranking.html">
      <div class="flashcard__icon-wrap">
        <svg class="flashcard__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M18 20V10M12 20V4M6 20v-6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="flashcard__label">Ranking</div>
        <div class="flashcard__sub">Top 10 คะแนนสูงสุด</div>
      </div>
    </a>

    <a class="flashcard flashcard--redeem" href="redeem.html">
      <div class="flashcard__icon-wrap">
        <svg class="flashcard__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7M22 7H2v5h20V7zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
        </svg>
      </div>
      <div>
        <div class="flashcard__label">Redeem</div>
        <div class="flashcard__sub">แลก Gift Card</div>
      </div>
    </a>

  </div>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item active" href="home.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M3 12L12 3l9 9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 21V12h6v9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="nav-item__label">หน้าหลัก</span>
  </a>
  <a class="nav-item" href="calendar.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="3" y="4" width="18" height="18" rx="3"/>
      <path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round"/>
    </svg>
    <span class="nav-item__label">ตาราง</span>
  </a>
  <a class="nav-item" href="ranking.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M18 20V10M12 20V4M6 20v-6" stroke-linecap="round"/>
    </svg>
    <span class="nav-item__label">Ranking</span>
  </a>
  <a class="nav-item" href="redeem.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7M22 7H2v5h20V7zM12 22V7"/>
    </svg>
    <span class="nav-item__label">Redeem</span>
  </a>
</nav>

<!-- HISTORY BOTTOM SHEET -->
<div class="overlay" id="historyOverlay" onclick="closeHistory(event)">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <h3 class="sheet-title">ประวัติ Point</h3>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script src="../js/config.js"></script>
<script>
const MAX_PROG = 300;
const MONTH_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function formatDate(isoStr) {
  const d = new Date(isoStr);
  return `${d.getDate()} ${MONTH_TH[d.getMonth()]} ${d.getFullYear() + 543}`;
}

function formatDateTime(isoStr) {
  const d = new Date(isoStr);
  return `${d.getDate()} ${MONTH_TH[d.getMonth()]} ${d.getFullYear() + 543}  ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

const session = Session.require();

function renderHero(user) {
  const initial = (user.firstname || '?')[0].toUpperCase();
  document.getElementById('heroAvatar').textContent = initial;
  document.getElementById('heroBrand').textContent = (user.brandName || '') + ' · ' + (user.workLocation || '');
  document.getElementById('heroName').textContent = user.firstname + ' ' + user.lastname;
  document.getElementById('heroSub').textContent = user.functionName || '';

  const total  = Number(user.totalPoint) || 0;
  const avail  = Number(user.availablePoint) || 0;
  const redeem = total - avail;
  const pct    = Math.min(Math.round((total / MAX_PROG) * 100), 100);

  document.getElementById('totalPoint').textContent  = total.toLocaleString();
  document.getElementById('availPoint').textContent  = avail.toLocaleString();
  document.getElementById('redeemPoint').textContent = redeem.toLocaleString();
  document.getElementById('progressPct').textContent = pct + '%';

  requestAnimationFrame(() => {
    setTimeout(() => {
      document.getElementById('progressFill').style.width = pct + '%';
    }, 100);
  });
}

renderHero(session);

async function refreshProfile() {
  const result = await api('getUserProfile', { empId: session.empId });
  if (result.success) {
    Object.assign(session, result.user);
    Session.save(session);
    renderHero(result.user);
  }
}

let historyLoaded = false;

async function openHistory() {
  const overlay = document.getElementById('historyOverlay');
  const list    = document.getElementById('historyList');
  overlay.classList.add('visible');
  document.body.style.overflow = 'hidden';
  if (historyLoaded) return;

  list.innerHTML = `<div style="padding:20px 0;text-align:center;color:var(--text-3);font-size:13px;">กำลังโหลด...</div>`;

  const result = await api('getPointHistory', { empId: session.empId });

  if (!result.success) {
    historyLoaded = false;
    list.innerHTML = `<div class="empty-state"><p>โหลดประวัติ Point ไม่สำเร็จ</p><small>${result.message || ''}</small><button class="btn" style="margin-top:16px;" onclick="historyLoaded=false;openHistory()">ลองใหม่</button></div>`;
    return;
  }

  if (!Array.isArray(result.history) || !result.history.length) {
    historyLoaded = true;
    list.innerHTML = `<div class="empty-state"><p>ยังไม่มีประวัติ Point</p></div>`;
    return;
  }

  historyLoaded = true;

  const iconMap = {
    earn:       `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 16V4M4 10l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    redeem:     `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4v12M4 10l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    admin:      `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M10 7v3l2 2" stroke-linecap="round"/></svg>`,
    admin_edit: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 3.5l2 2L7 15l-3 1 1-3 9.5-9.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  };

  list.innerHTML = result.history.map(item => {
    const point = Number(item.Point) || 0;
    const type  = item.Type || 'earn';
    return `
      <div class="history-item">
        <div class="history-icon history-icon--${type}">${iconMap[type] || iconMap.earn}</div>
        <div class="history-info">
          <div class="history-reason">${item.Reason || 'Point Transaction'}</div>
          <div class="history-date">${formatDateTime(item.Date)}</div>
        </div>
        <div class="history-pt ${point >= 0 ? 'history-pt--pos' : 'history-pt--neg'}">
          ${point >= 0 ? '+' : ''}${point}
        </div>
      </div>`;
  }).join('');
}

function closeHistory(e) {
  document.getElementById('historyOverlay').classList.remove('visible');
  document.body.style.overflow = '';
}

function logout() {
  if (confirm('ออกจากระบบ?')) {
    Session.clear();
    window.location.href = '../index.html';
  }
}

refreshProfile();
</script>
</body>
</html>
