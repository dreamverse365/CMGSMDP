<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CMG SMDP — Ranking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
  <style>
    body::before {
      content: '';
      position: fixed; top: -20%; left: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(186,43,43,0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .page-body { position: relative; z-index: 1; }

    .ranking-intro { margin: 4px 0 24px; }
    .ranking-eyebrow {
      color: var(--brand);
      font: 700 10px/1 'Manrope', sans-serif;
      letter-spacing: .18em; margin-bottom: 9px;
    }
    .ranking-title {
      font: 800 clamp(25px, 7vw, 34px)/1.15 'Manrope', sans-serif;
      letter-spacing: -.03em; margin-bottom: 9px;
      color: var(--text);
    }
    .ranking-copy { color: var(--text-2); font-size: 13px; line-height: 1.65; }

    /* ── LEADER CARD — light theme สอดคล้องกับ hero-card ใน home ── */
    .leader-card {
      background: linear-gradient(145deg, #ffffff 0%, #fdf5f5 100%);
      border: 1px solid rgba(186,43,43,0.12);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(186,43,43,0.04),
        0 12px 40px rgba(25,25,25,0.07);
    }

    /* แถบแดงด้านบน — เหมือน hero-card */
    .leader-card::before {
      content: '';
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
      border-radius: 0 0 4px 4px;
    }

    /* grid texture — เหมือน hero-card */
    .leader-card::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(186,43,43,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(186,43,43,0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .leader-rank {
      display: inline-flex; align-items: center; gap: 7px; margin-bottom: 20px;
      color: var(--brand); font: 700 10px/1 'Manrope', sans-serif;
      letter-spacing: .15em;
      position: relative; z-index: 1;
    }
    .leader-rank svg { width: 16px; height: 16px; }

    .leader-profile {
      display: flex; align-items: flex-end;
      justify-content: space-between; gap: 16px;
      position: relative; z-index: 1;
    }
    .leader-name {
      font: 800 20px/1.3 'Manrope', sans-serif;
      color: var(--text);
    }
    .leader-meta { color: var(--text-2); font-size: 12px; margin-top: 5px; }
    .leader-point { text-align: right; flex-shrink: 0; }
    .leader-point strong {
      display: block;
      color: var(--gold-dark);
      font: 800 36px/1 'Manrope', sans-serif;
      letter-spacing: -.04em;
    }
    .leader-point span {
      color: var(--text-3);
      font-size: 10px; letter-spacing: .12em;
    }

    /* ── RANK ROWS — light theme ── */
    .ranking-list { display: grid; gap: 10px; }
    .rank-row {
      display: grid; grid-template-columns: 42px minmax(0,1fr) auto;
      align-items: center; gap: 12px; min-height: 70px; padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      transition: border-color .2s, background .2s, box-shadow .2s, transform .15s;
    }
    .rank-row:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }

    /* "YOU" highlight — ใช้โทนแดง CMG แทนทอง */
    .rank-row.is-current {
      background: linear-gradient(100deg, rgba(186,43,43,0.05), var(--surface));
      border-color: rgba(186,43,43,0.2);
    }

    .rank-no {
      width: 36px; height: 36px; display: grid; place-items: center;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text-2);
      font: 700 13px/1 'Manrope', sans-serif;
      border: 1px solid var(--border);
    }
    /* อันดับ 2 — สีเงิน */
    .rank-no--2 {
      color: #6b7280;
      background: rgba(107,114,128,0.08);
      border-color: rgba(107,114,128,0.2);
    }
    /* อันดับ 3 — สีทองแดง */
    .rank-no--3 {
      color: #92400e;
      background: rgba(146,64,14,0.08);
      border-color: rgba(146,64,14,0.2);
    }

    .rank-name {
      color: var(--text);
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rank-brand {
      color: var(--text-3);
      font-size: 11px; margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .you-badge {
      display: inline-flex; margin-left: 6px; padding: 2px 6px;
      border-radius: 99px;
      color: var(--brand);
      background: var(--brand-soft);
      border: 1px solid rgba(186,43,43,0.15);
      font-size: 9px; font-weight: 700;
      letter-spacing: .06em; vertical-align: 1px;
    }
    .rank-point {
      text-align: right;
      color: var(--gold-dark);
      font: 800 17px/1 'Manrope', sans-serif;
    }
    .rank-point small {
      display: block; color: var(--text-3);
      font-size: 9px; margin-top: 5px; letter-spacing: .08em;
    }

    /* ── NOTE — light theme ── */
    .ranking-note {
      display: flex; gap: 10px; align-items: flex-start; margin-top: 18px;
      padding: 14px; border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2); font-size: 11px; line-height: 1.6;
    }
    .ranking-note svg { width: 17px; height: 17px; flex-shrink: 0; color: var(--brand); }

    /* ── MISC ── */
    .loading-list { display: grid; gap: 10px; }
    .loading-row { height: 70px; border-radius: var(--radius-lg); }
    .state-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .state-card .btn { min-height: 44px; margin-top: 16px; }

    .page-header__back { min-width: 44px; min-height: 44px; }
    .nav-item { min-height: 48px; }
    .btn:focus-visible, a:focus-visible, button:focus-visible {
      outline: 2px solid var(--brand); outline-offset: 3px;
    }
    @media (max-width: 360px) {
      .page-body { padding-inline: 16px; }
      .leader-card { padding: 20px; }
      .leader-point strong { font-size: 30px; }
      .rank-row { grid-template-columns: 38px minmax(0,1fr) auto; padding-inline: 12px; gap: 9px; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <button class="page-header__back" type="button" onclick="location.href='home.html'" aria-label="กลับหน้าหลัก">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M13 4l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      กลับ
    </button>
    <div class="page-header__title">RANKING</div>
    <div style="width:44px" aria-hidden="true"></div>
  </header>

  <main class="page-body">
    <section class="ranking-intro" aria-labelledby="rankingTitle">
      <div class="ranking-eyebrow">CMG SMDP LEADERBOARD</div>
      <h1 class="ranking-title" id="rankingTitle">Top 10 Ranking</h1>
      <p class="ranking-copy">อันดับคะแนนสะสมสูงสุดตลอดโครงการ อ้างอิงจาก Total Point</p>
    </section>

    <div id="rankingContent" aria-live="polite" aria-busy="true">
      <div class="loading-list" aria-label="กำลังโหลดอันดับ">
        <div class="skeleton loading-row"></div>
        <div class="skeleton loading-row"></div>
        <div class="skeleton loading-row"></div>
        <div class="skeleton loading-row"></div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="เมนูหลัก">
    <a class="nav-item" href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M3 12L12 3l9 9M9 21V12h6v9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="nav-item__label">หน้าหลัก</span>
    </a>
    <a class="nav-item" href="calendar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      <span class="nav-item__label">ตาราง</span>
    </a>
    <a class="nav-item active" href="ranking.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M18 20V10M12 20V4M6 20v-6" stroke-linecap="round"/>
      </svg>
      <span class="nav-item__label">Ranking</span>
    </a>
    <a class="nav-item" href="redeem.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7M22 7H2v5h20V7zM12 22V7"/>
      </svg>
      <span class="nav-item__label">Redeem</span>
    </a>
  </nav>

  <script src="../js/config.js"></script>
  <script>
    const session = Session.require();

    function createTextElement(tag, className, text) {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = text ?? '';
      return element;
    }

    function fullName(user) {
      return [user.firstname, user.lastname].filter(Boolean).join(' ') || 'ไม่ระบุชื่อ';
    }

    function renderLeader(user) {
      const card = document.createElement('section');
      card.className = 'leader-card';
      card.setAttribute('aria-label', 'อันดับหนึ่ง');

      const rank = document.createElement('div');
      rank.className = 'leader-rank';
      rank.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 3h8v4a4 4 0 0 1-8 0V3zM8 5H4v1a4 4 0 0 0 4 4M16 5h4v1a4 4 0 0 1-4 4M12 11v5M8 21h8M9 16h6v5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>NO. 1 THIS PROJECT</span>';

      const profile = document.createElement('div');
      profile.className = 'leader-profile';
      const info = document.createElement('div');
      const name = createTextElement('div', 'leader-name', fullName(user));
      if (String(user.empId) === String(session.empId)) {
        const badge = createTextElement('span', 'you-badge', 'YOU');
        name.appendChild(badge);
      }
      info.append(name, createTextElement('div', 'leader-meta', user.brandName || 'CMG'));

      const point = document.createElement('div');
      point.className = 'leader-point';
      point.append(
        createTextElement('strong', '', Number(user.totalPoint || 0).toLocaleString()),
        createTextElement('span', '', 'TOTAL POINTS')
      );
      profile.append(info, point);
      card.append(rank, profile);
      return card;
    }

    function renderRankRow(user) {
      const row = document.createElement('article');
      const isCurrent = String(user.empId) === String(session.empId);
      row.className = `rank-row${isCurrent ? ' is-current' : ''}`;

      const number = createTextElement('div', `rank-no rank-no--${user.rank}`, user.rank);
      const info = document.createElement('div');
      info.style.minWidth = '0';
      const name = createTextElement('div', 'rank-name', fullName(user));
      if (isCurrent) name.appendChild(createTextElement('span', 'you-badge', 'YOU'));
      info.append(name, createTextElement('div', 'rank-brand', user.brandName || 'CMG'));

      const points = createTextElement('div', 'rank-point', Number(user.totalPoint || 0).toLocaleString());
      points.appendChild(createTextElement('small', '', 'POINTS'));
      row.append(number, info, points);
      return row;
    }

    function renderError(message) {
      const container = document.getElementById('rankingContent');
      container.setAttribute('aria-busy', 'false');
      container.innerHTML = '<div class="state-card empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg><p>โหลด Ranking ไม่สำเร็จ</p><small id="rankingError" style="display:block;margin-top:6px"></small><button class="btn btn--ghost" type="button" onclick="loadRanking()">ลองใหม่</button></div>';
      document.getElementById('rankingError').textContent = message || 'กรุณาลองใหม่อีกครั้ง';
    }

    async function loadRanking() {
      const container = document.getElementById('rankingContent');
      container.setAttribute('aria-busy', 'true');

      const result = await api('getRanking');
      if (!result.success) {
        renderError(result.message);
        return;
      }

      if (!Array.isArray(result.ranking) || result.ranking.length === 0) {
        container.setAttribute('aria-busy', 'false');
        container.innerHTML = '<div class="state-card empty-state"><p>ยังไม่มีข้อมูล Ranking</p></div>';
        return;
      }

      const fragment = document.createDocumentFragment();
      fragment.appendChild(renderLeader(result.ranking[0]));

      if (result.ranking.length > 1) {
        const label = createTextElement('p', 'section-label', 'อันดับคะแนนสะสม');
        fragment.appendChild(label);
        const list = document.createElement('div');
        list.className = 'ranking-list';
        result.ranking.slice(1).forEach(user => list.appendChild(renderRankRow(user)));
        fragment.appendChild(list);
      }

      const note = document.createElement('div');
      note.className = 'ranking-note';
      note.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 8h.01" stroke-linecap="round"/></svg><span>Ranking คำนวณจากคะแนนสะสมทั้งหมด (Total Point) คะแนนจะไม่ลดลงเมื่อแลกของรางวัล</span>';
      fragment.appendChild(note);

      container.replaceChildren(fragment);
      container.setAttribute('aria-busy', 'false');
    }

    loadRanking();
  </script>
</body>
</html>
